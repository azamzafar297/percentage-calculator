<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a1f;--mut:#5d6b5f;--ac:#2e7d32;--bd:#d9dfd6;--res:#e8f3e8;--key:#eef1ec;--op:#dcebdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111611;--card:#1b231b;--tx:#e8efe8;--mut:#a3b0a3;--ac:#66bb6a;--bd:#2f3b2f;--res:#223322;--key:#263126;--op:#2f4a2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:420px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:6px 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px;color:var(--ac)}
.r{display:flex;gap:8px}
input{flex:1;min-width:0;padding:10px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.o{margin-top:10px;padding:10px;border-radius:8px;background:var(--res);font-weight:600;min-height:2.6em}
#d{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:right;font-size:2rem;min-height:3.4rem;overflow-x:auto;white-space:nowrap}
#k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
button{padding:16px 0;font-size:1.3rem;border:1px solid var(--bd);border-radius:10px;background:var(--key);color:var(--tx);cursor:pointer}
button.op{background:var(--op);font-weight:700}
button.eq{background:var(--ac);color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Calculator</h1>

<div class="c">
<h2>Discount Calculator</h2>
<div class="r">
<input id="p" type="number" inputmode="decimal" placeholder="Qeemat">
<input id="q" type="number" inputmode="decimal" placeholder="Discount %">
</div>
<div class="o" id="o"></div>
</div>

<div class="c">
<h2>Calculator</h2>
<div id="d">0</div>
<div id="k"></div>
</div>
</main>
<script>
const fm=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const p=document.getElementById('p'),q=document.getElementById('q'),o=document.getElementById('o');
function disc(){
  if(p.value===''||q.value===''){o.textContent='';return}
  const a=+p.value,b=+q.value,d=a*b/100;
  o.textContent='Discount = '+fm(d)+' | Dene wali qeemat = '+fm(a-d);
}
p.oninput=q.oninput=disc;

const d=document.getElementById('d');
let cur='0',prev=null,op=null,fresh=false;
function show(){d.textContent=cur}
function calc(a,b,o){
  if(o==='+')return a+b;
  if(o==='-')return a-b;
  if(o==='*')return a*b;
  if(o==='/')return b===0?'Error':a/b;
}
function fmt(r){return r==='Error'?r:String(parseFloat(r.toFixed(10)))}
function press(k){
  if(cur==='Error'&&k!=='C'){return}
  if(k>='0'&&k<='9'){
    if(fresh||cur==='0'){cur=k}else{cur+=k}
    fresh=false;
  }else if(k==='.'){
    if(fresh){cur='0.';fresh=false}
    else if(!cur.includes('.')){cur+='.'}
  }else if(k==='C'){
    cur='0';prev=null;op=null;fresh=false;
  }else if(k==='<'){
    if(!fresh){cur=cur.length>1?cur.slice(0,-1):'0'}
  }else if(k==='='){
    if(op!==null&&prev!==null){
      cur=fmt(calc(prev,parseFloat(cur),op));
      op=null;prev=null;fresh=true;
    }
  }else{
    if(op!==null&&!fresh){
      cur=fmt(calc(prev,parseFloat(cur),op));
    }
    if(cur!=='Error'){prev=parseFloat(cur);op=k;fresh=true}
  }
  show();
}
const keys=[['C','C',''],['<','⌫',''],['/','÷','op'],['*','×','op'],
['7','7',''],['8','8',''],['9','9',''],['-','−','op'],
['4','4',''],['5','5',''],['6','6',''],['+','+','op'],
['1','1',''],['2','2',''],['3','3',''],['=','=','eq'],
['0','0',''],['.','.','']];
const kb=document.getElementById('k');
keys.forEach(x=>{
  const b=document.createElement('button');
  b.textContent=x[1];
  if(x[2])b.className=x[2];
  if(x[0]==='=')b.style.gridRow='span 2';
  b.onclick=()=>press(x[0]);
  kb.appendChild(b);
});
</script>
</body>
</html>
