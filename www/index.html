<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کیلکولیٹر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a1f;--mut:#5d6b5f;--ac:#2e7d32;--bd:#d9dfd6;--res:#e8f3e8;--key:#eef1ec;--op:#dcebdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111611;--card:#1b231b;--tx:#e8efe8;--mut:#a3b0a3;--ac:#66bb6a;--bd:#2f3b2f;--res:#223322;--key:#263126;--op:#2f4a2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.8}
main{max-width:420px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:6px 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px;color:var(--ac)}
.r{display:flex;gap:8px}
input,select{flex:1;min-width:0;padding:10px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit}
.o{margin-top:10px;padding:10px;border-radius:8px;background:var(--res);font-weight:600;min-height:2.6em}
#d{direction:ltr;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:right;font-size:2rem;min-height:3.4rem;overflow-x:auto;white-space:nowrap;line-height:1.4;font-family:system-ui,sans-serif}
#k{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
button{padding:16px 0;font-size:1.3rem;border:1px solid var(--bd);border-radius:10px;background:var(--key);color:var(--tx);cursor:pointer;font-family:system-ui,sans-serif}
button.op{background:var(--op);font-weight:700}
button.eq{background:var(--ac);color:#fff;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.sc{width:100%;padding:12px;font-size:1rem;margin-bottom:10px;background:var(--op);font-family:inherit}
#io,#fo,#go,#ro,#co,#bo,#to{white-space:pre-line}
.m{font-size:.8rem;color:var(--mut);margin-top:8px}
.ai{white-space:pre-wrap;font-size:.95rem;color:var(--tx)}
summary{cursor:pointer;color:var(--ac);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>کیلکولیٹر</h1>

<div class="c">
<h2>مقدار × ریٹ = کل رقم</h2>
<div class="r">
<input id="sq" type="number" inputmode="decimal" placeholder="مقدار">
<select id="su"><option value="g">گرام</option><option value="kg">کلو</option><option value="maund">من</option><option value="pc">عدد / پیک</option></select>
</div>
<div class="r" style="margin-top:8px">
<input id="sr" type="number" inputmode="decimal" placeholder="ریٹ">
<select id="sv"><option value="kg">فی کلو</option><option value="g">فی گرام</option><option value="maund">فی من</option><option value="pc">فی عدد / پیک</option></select>
</div>
<div class="o" id="so"></div>
</div>

<div class="c">
<h2>ڈسکاؤنٹ کیلکولیٹر</h2>
<div class="r">
<input id="p" type="number" inputmode="decimal" placeholder="قیمت">
<input id="q" type="number" inputmode="decimal" placeholder="ڈسکاؤنٹ %">
</div>
<div class="o" id="o"></div>
</div>

<div class="c">
<h2>نفع / نقصان کیلکولیٹر</h2>
<div class="r">
<input id="fc" type="number" inputmode="decimal" placeholder="خرید قیمت">
<input id="fs" type="number" inputmode="decimal" placeholder="بیچنے کی قیمت">
</div>
<div class="o" id="fo"></div>
</div>

<div class="c">
<h2>نفع فیصد لگا کر بیچنے کی قیمت</h2>
<div class="r">
<input id="gc" type="number" inputmode="decimal" placeholder="خرید قیمت">
<input id="gp" type="number" inputmode="decimal" placeholder="نفع %">
</div>
<div class="o" id="go"></div>
</div>

<div class="c">
<h2>رقبہ / ایکڑ کیلکولیٹر</h2>
<div class="r">
<input id="ra" type="number" inputmode="decimal" placeholder="رقبہ">
<select id="ru"><option value="acre">ایکڑ</option><option value="kanal">کنال</option><option value="marla">مرلہ</option></select>
</div>
<div class="g" style="margin-top:8px">
<input id="rd" type="number" inputmode="decimal" placeholder="دوائی فی ایکڑ (ml/گرام)">
<input id="rp" type="number" inputmode="decimal" placeholder="پیک سائز (ml/گرام)">
<input id="rw" type="number" inputmode="decimal" placeholder="پانی فی ایکڑ (لیٹر)">
<input id="rt" type="number" inputmode="decimal" placeholder="ٹینک (لیٹر)">
</div>
<div class="o" id="ro"></div>
<div class="m">دوائی کی مقدار ہمیشہ کمپنی کے لیبل سے دیکھ کر لکھیں۔</div>
</div>

<div class="c">
<h2>یونٹ کنورٹر</h2>
<div class="r">
<input id="cv" type="number" inputmode="decimal" placeholder="مقدار">
<select id="cu"><option value="acre">ایکڑ</option><option value="kanal">کنال</option><option value="marla">مرلہ</option><option value="maund">من</option><option value="kg">کلو</option><option value="ton">ٹن</option><option value="litre">لیٹر</option><option value="ml">ملی لیٹر</option></select>
</div>
<div
